<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table , th , td {
            border-collapse: collapse;
            border: 1px solid black;
            text-align: center;
        }
        table{
            border: 3px solid darkblue;
        }
        tr:hover{
            background-color: rgb(35, 112, 235);
        }
        th{
            background-color:blue ;
            color: white;
        }
        .box{
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1{
            text-align: center;
        }
    </style>
</head>

</body>
</html>
